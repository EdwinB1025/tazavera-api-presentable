        name: coffeeInventoryId
        description: 'The ULID of the coffee inventory item the offerings are based on. Despite the name, this expects a ULID, not a numeric ID. Must match an existing stored value.'
        required: true
        example: 01J8ZK...
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
