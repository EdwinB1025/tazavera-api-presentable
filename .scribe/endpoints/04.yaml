  -
    custom: []
    httpMethods:
      - PATCH
    uri: 'evaluations/{evaluation_ulid}/close'
    metadata:
      custom: []
      groupName: Evaluations
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Close an evaluation'
      description: |-
        Transitions an evaluation to the **closed** state, finalizing it. A closed
        evaluation can no longer be updated. No request body is required — the
        evaluation is validated and closed using the data already stored.

        The evaluation is only closed if it is complete. Completeness requires all
        15 sensory scores greater than 0 (7 descriptive + 8 affective), plus at
        least one taste reference for each of: main tastes, mouthfeel, and the
        aromatic set (fragrance/aroma/flavor/aftertaste). If any is missing, the
        request fails with `409 Conflict`.

        If the evaluation is **already closed**, the endpoint returns `200 OK`
        idempotently.

        Closing dispatches an `EvaluationClosed` event, which recalculates the
        offering's aggregate scores and concordance (via OfferingConsensusService).

        **Authorization:** requires the `specialist` role and permission to update
        the evaluation (enforced by the evaluation policy). A specialist who does
        not own the evaluation receives `403 Forbidden`.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      evaluation_ulid:
        custom: []
        name: evaluation_ulid
        description: 'The ULID of the evaluation.'
        required: true
        example: 01M35F5RX4ADGC3CSDXXYB08DA
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      evaluation_ulid: 01M35F5RX4ADGC3CSDXXYB08DA
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"message": "Evaluation closed."}'
        headers: []
        description: 'Closed successfully'
      -
        custom: []
        status: 200
        content: '{"message": "Evaluation closed."}'
        headers: []
        description: 'Already closed'
      -
        custom: []
        status: 403
        content: '{"message": "One or more evaluations do not belong to the user."}'
        headers: []
        description: 'Not the owner'
      -
        custom: []
        status: 409
        content: '{"message": "Evaluation is incomplete, all scores need to be provided, and at least one cata attribute for each MainTastes, mouthfeel and the set of sensorial axis."}'
        headers: []
        description: 'Evaluation incomplete'
